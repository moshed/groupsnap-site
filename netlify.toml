[build]
  publish = "."

# Apple refuses an apple-app-site-association that isn't application/json.
# GitHub Pages serves it as application/octet-stream and gives no way to
# override, which is why this site is not hosted there.
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"
